<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fffaf8">
<title>Private Game | Ironsworn Solo RPG</title>
<link rel="stylesheet" href="private-main.css?v=1">
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand"><b id="charName">Ironsworn</b><span>PRIVATE GAME</span></div>
    <div class="top-actions"><button id="homeBtn" type="button">HOME</button><button id="saveBtn" type="button" class="primary">SAVE</button></div>
  </header>

  <section id="stats" class="stats"></section>
  <section id="tracks" class="tracks"></section>

  <section class="vow box">
    <div class="section-head"><div><small>CURRENT VOW</small><h2 id="vowTitle">未設定</h2></div><div class="vow-num"><b id="vowProgress">0</b><span>/10</span></div></div>
    <div class="vow-track" id="vowTrack"></div>
    <div class="vow-actions"><button type="button" data-vow="-1">−</button><button type="button" data-vow="1">＋</button></div>
  </section>

  <section class="main-panel box">
    <nav class="tabs">
      <button class="on" type="button" data-tab="adventure">冒険</button>
      <button type="button" data-tab="assets">アセット</button>
      <button type="button" data-tab="log">記録</button>
    </nav>

    <div class="panel on" data-panel="adventure">
      <div class="info-card"><small>開始場面</small><p id="openingScene"></p></div>
      <div class="info-card"><small>発端事件</small><p id="incident"></p></div>
      <label class="log-input">今起きたこと<textarea id="logText" rows="4" placeholder="場面、判定結果、出来事など"></textarea></label>
      <button id="addLogBtn" class="wide primary" type="button">記録する</button>
    </div>

    <div class="panel" data-panel="assets">
      <div id="assetList" class="asset-list"></div>
    </div>

    <div class="panel" data-panel="log">
      <div id="logList" class="log-list"></div>
    </div>
  </section>

  <div id="status" class="status"></div>
</main>
<script src="private-main.js?v=1"></script>
</body>
</html>
