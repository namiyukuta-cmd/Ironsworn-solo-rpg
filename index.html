<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fffaf8">
<title>Ironsworn Solo RPG</title>
<link rel="stylesheet" href="styles.css?v=repair1">
</head>
<body>
<section id="homeScreen" class="screen">
  <div class="home-card">
    <div class="home-mark">鉄</div>
    <h1>Ironsworn<br>Solo RPG</h1>
    <div class="en">SOLO ADVENTURE</div>
    <div class="home-actions">
      <button id="homeLoad" class="home-btn primary">LOAD</button>
      <button id="homeNew" class="home-btn">NEW</button>
    </div>
    <div class="home-foot">キャラクターごとに別セーブ</div>
  </div>
</section>

<section id="newScreen" class="screen hidden">
  <div class="new-card">
    <h1>新しいキャラクター</h1>
    <label class="new-label" for="newName">名前</label>
    <input id="newName" class="new-input" maxlength="24" placeholder="キャラクター名">
    <label class="new-label">能力値</label>
    <div class="new-stats">
      <div class="new-stat"><span>EDGE</span><select id="newEdge"><option>1</option><option>2</option><option selected>3</option></select></div>
      <div class="new-stat"><span>HEART</span><select id="newHeart"><option selected>1</option><option>2</option><option>3</option></select></div>
      <div class="new-stat"><span>IRON</span><select id="newIron"><option>1</option><option selected>2</option><option>3</option></select></div>
      <div class="new-stat"><span>SHADOW</span><select id="newShadow"><option selected>1</option><option>2</option><option>3</option></select></div>
      <div class="new-stat"><span>WITS</span><select id="newWits"><option>1</option><option selected>2</option><option>3</option></select></div>
    </div>
    <div class="new-help">Ironsworn標準：3 / 2 / 2 / 1 / 1 を5能力に割り振ります。</div>
    <div id="newError" class="new-error"></div>
    <div class="new-actions"><button id="cancelNew">戻る</button><button id="createNew" class="create">作成</button></div>
  </div>
</section>

<section id="gameScreen" class="screen hidden">
  <div class="app">
    <header class="game-header box">
      <div class="brand"><h1 id="charName">白金</h1><span>IRONSWORN CHARACTER SHEET</span></div>
      <div class="top-tools">
        <button id="goHome" class="top-btn">ホーム</button>
        <button id="openSave" class="top-btn">セーブ</button>
        <div class="xp"><span>XP</span><button class="sbtn" data-k="xp" data-d="-1">−</button><strong id="xp">1</strong><button class="sbtn" data-k="xp" data-d="1">＋</button></div>
      </div>
    </header>
    <section class="stats">
      <div class="stat box"><span>EDGE</span><b id="statEdge">3</b></div>
      <div class="stat box"><span>HEART</span><b id="statHeart">1</b></div>
      <div class="stat box"><span>IRON</span><b id="statIron">2</b></div>
      <div class="stat box"><span>SHADOW</span><b id="statShadow">1</b></div>
      <div class="stat box"><span>WITS</span><b id="statWits">2</b></div>
    </section>
    <section class="resources">
      <div class="res box"><div class="rhead"><span class="label">体力</span><div class="ctrl"><button class="tinybtn" data-k="health" data-d="-1">−</button><strong id="health">5</strong><button class="tinybtn" data-k="health" data-d="1">＋</button></div></div></div>
      <div class="res box"><div class="rhead"><span class="label">気力</span><div class="ctrl"><button class="tinybtn" data-k="spirit" data-d="-1">−</button><strong id="spirit">5</strong><button class="tinybtn" data-k="spirit" data-d="1">＋</button></div></div></div>
      <div class="res box"><div class="rhead"><span class="label">補給</span><div class="ctrl"><button class="tinybtn" data-k="supply" data-d="-1">−</button><strong id="supply">5</strong><button class="tinybtn" data-k="supply" data-d="1">＋</button></div></div></div>
      <div class="mom box"><div class="mhead"><span class="label">モメンタム</span><div class="ctrl"><button class="tinybtn" data-k="momentum" data-d="-1">−</button><strong id="momentum">2</strong><button class="tinybtn" data-k="momentum" data-d="1">＋</button></div></div><div id="mtrack" class="mtrack"></div></div>
    </section>
    <section class="vow box">
      <div class="vow-title"><small>現在の誓い</small><strong id="vowTitle">未設定</strong></div>
      <div id="vtrack" class="vtrack"></div><div class="vow-num"><span id="vp">0</span>/10</div>
    </section>
    <section class="lower">
      <div class="panel box">
        <div class="ptitle"><h2>アセット</h2><div class="asset-head-tools"><span id="assetCount" class="asset-count"></span><button id="assetAddTop" class="asset-add-small">＋追加</button></div></div>
        <div id="assets" class="assets"></div>
      </div>
      <div class="panel box"><div class="ptitle"><h2>刺青</h2><span id="tattooHint">タップで状態切替</span></div><div id="tattoos" class="tattoos"></div></div>
    </section>
  </div>
</section>

<div id="managerModal" class="modal-backdrop">
  <div class="save-modal">
    <div class="save-modal-head"><h2 id="managerTitle">ロード</h2><button id="closeManager" class="close-btn">×</button></div>
    <p id="managerNote" class="save-note"></p>
    <button id="saveCurrent" class="save-action github" style="display:none;width:100%;margin:6px 0;padding:9px">現在の状態を保存</button>
    <div id="characterList"></div><div id="slotArea"></div>
    <div class="save-action-row">
      <button id="loadGithub" class="save-action github">GitHubの白金・最新セーブを読み込む</button>
      <button id="exportSave" class="save-action">JSONを書き出す</button>
      <button id="importSave" class="save-action">JSONを読み込む</button>
      <input id="importFile" class="hidden-file" type="file" accept="application/json,.json">
    </div>
    <div id="saveStatus" class="save-status"></div>
  </div>
</div>
<script src="app.js?v=repair1"></script>
</body>
</html>
