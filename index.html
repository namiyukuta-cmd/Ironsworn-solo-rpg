<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Ironsworn Solo RPG</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Yomogi&family=Zen+Maru+Gothic:wght@400;500;700&display=swap');
:root{--bg:#fffaf8;--paper:#fff;--pink:#f4c3cf;--pink2:#ffe7ed;--pink3:#eaa4b7;--brown:#7d574a;--brown2:#ad887c;--line:#d8bbb1;--text:#5a4038}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Zen Maru Gothic",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}.screen{width:100%;height:100dvh}.hidden{display:none!important}.box{background:var(--paper);border:1.5px solid var(--brown);border-radius:10px}
#homeScreen,#newScreen{display:grid;place-items:center;padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));background:radial-gradient(circle at 50% 34%,#fff 0,#fff7fa 45%,#fffaf8 100%)}
.home-card,.new-card{width:min(380px,92vw);text-align:center}.home-mark{width:76px;height:76px;margin:0 auto 14px;border:2px solid var(--brown);border-radius:50%;display:grid;place-items:center;background:var(--pink2);font:700 31px/1 "Yomogi",sans-serif}.home-card h1,.new-card h1{margin:0;font:700 31px/1.15 "Yomogi","Zen Maru Gothic",sans-serif;color:var(--brown)}.home-card .en{font-size:8px;letter-spacing:.18em;color:var(--brown2);margin:5px 0 24px}.home-actions{display:grid;gap:10px}.home-btn{height:54px;border:2px solid var(--brown);border-radius:16px;background:white;font:700 18px/1 "Yomogi","Zen Maru Gothic",sans-serif}.home-btn.primary{background:var(--pink)}.home-foot{margin-top:18px;font-size:8px;color:var(--brown2)}
.new-card{border:2px solid var(--brown);border-radius:18px;background:white;padding:16px;text-align:left}.new-card h1{text-align:center;font-size:25px;margin-bottom:12px}.new-label{display:block;font-size:10px;color:var(--brown2);margin:8px 0 4px}.new-input{width:100%;border:1.5px solid var(--brown2);border-radius:10px;background:#fffafd;padding:9px}.new-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:6px}.new-stat{border:1px solid var(--line);border-radius:9px;padding:5px;background:#fffdfd;text-align:center}.new-stat span{display:block;font:500 7px/1 "Yomogi",sans-serif;color:var(--brown2);margin-bottom:3px}.new-stat select{width:100%;border:1px solid var(--line);border-radius:6px;background:white;padding:4px;font-size:11px}.new-help{font-size:8px;color:var(--brown2);margin-top:7px}.new-error{font-size:8px;color:#aa536b;min-height:13px;margin-top:5px}.new-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.new-actions button{height:42px;border:1.5px solid var(--brown);border-radius:12px;background:white}.new-actions .create{background:var(--pink)}
.app{height:100dvh;padding:calc(5px + env(safe-area-inset-top)) 6px calc(5px + env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto auto auto 1fr;gap:4px;max-width:760px;margin:0 auto}.game-header{display:flex;align-items:center;justify-content:space-between;padding:4px 7px;min-height:36px}.brand{display:flex;align-items:baseline;gap:7px}.brand h1{margin:0;font:700 22px/1 "Yomogi","Zen Maru Gothic",sans-serif;color:var(--brown)}.brand span{font-size:8px;color:var(--brown2);letter-spacing:.08em}.top-tools{display:flex;align-items:center;gap:3px}.top-btn{border:1px solid var(--brown);background:var(--pink2);border-radius:7px;padding:3px 6px;font-size:8px;white-space:nowrap}.xp{display:flex;align-items:center;gap:3px;font-size:9px}.xp strong{font-size:15px;min-width:18px;text-align:center}.sbtn{width:21px;height:21px;padding:0;border:1px solid var(--brown);border-radius:7px;background:var(--pink2);line-height:1}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.stat{padding:2px 2px 3px;text-align:center;border:1px solid var(--line);border-radius:8px;background:#fffdfd}.stat span{display:block;font:500 8px/1 "Yomogi","Zen Maru Gothic",sans-serif;color:var(--brown2)}.stat b{display:block;font-size:17px;line-height:1.1}.resources{display:grid;grid-template-columns:repeat(3,1fr) 2.15fr;gap:3px}.res,.mom{border:1px solid var(--line);border-radius:8px;background:#fffdfd;padding:3px 4px}.rhead,.mhead{display:flex;align-items:center;justify-content:space-between;gap:2px}.label{font:500 8px/1 "Yomogi","Zen Maru Gothic",sans-serif;color:var(--brown2)}.ctrl{display:flex;align-items:center;gap:2px}.ctrl strong{font-size:14px;min-width:15px;text-align:center}.tinybtn{width:18px;height:18px;padding:0;border:1px solid var(--brown2);border-radius:6px;background:white;font-size:11px;line-height:1}.mtrack{display:grid;grid-template-columns:repeat(17,1fr);gap:1px;margin-top:3px}.mc{height:14px;border:1px solid var(--line);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:5.8px;background:#fff;color:var(--brown2);padding:0}.mc.on{background:var(--pink);border-color:var(--brown);color:var(--brown);font-weight:700}
.vow{padding:4px 6px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px}.vow-title small{display:block;font:500 7px/1 "Yomogi","Zen Maru Gothic",sans-serif;color:var(--brown2)}.vow-title strong{display:block;font-size:9px;white-space:nowrap;max-width:38vw;overflow:hidden;text-overflow:ellipsis}.vtrack{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}.vcell{height:16px;border:1px solid var(--brown2);border-radius:4px;background:white;padding:0}.vcell.on{background:var(--pink)}.vow-num{font-size:8px;white-space:nowrap}.lower{min-height:0;display:grid;grid-template-columns:1.15fr 1fr;gap:4px}.panel{min-height:0;padding:4px 5px;display:grid;grid-template-rows:auto 1fr}.ptitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}.ptitle h2{margin:0;font:700 10px/1 "Yomogi","Zen Maru Gothic",sans-serif;color:var(--brown)}.ptitle span{font-size:6.5px;color:var(--brown2)}.assets{min-height:0;display:grid;grid-template-rows:repeat(3,1fr);gap:3px}.asset{min-height:0;border:1px solid var(--line);border-radius:7px;background:#fffdfd;padding:3px 4px;display:grid;grid-template-columns:74px 1fr;align-items:start;gap:4px}.aname strong{display:block;font-size:8.5px;line-height:1.05}.aname small{display:block;font-size:5.8px;color:var(--brown2)}.abilities{display:flex;flex-wrap:wrap;align-content:start;gap:2px}.ability{font-size:6.3px;line-height:1.1;padding:2px 3px;border:1px solid var(--line);border-radius:5px;color:var(--brown2);background:white}.ability.on{background:var(--pink2);color:var(--brown);border-color:var(--pink3);font-weight:700}.empty-note{font-size:7px;color:var(--brown2);display:grid;place-items:center;height:100%;border:1px dashed var(--line);border-radius:7px}.tattoos{min-height:0;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr);gap:3px}.tat{min-height:0;border:1px solid var(--line);border-radius:7px;background:#fff;padding:2px 4px;text-align:left;display:flex;align-items:center;justify-content:space-between}.tat strong{font-size:8px}.tat span{font-size:5.8px;color:var(--brown2)}.tat.cool{background:#fff0f4;border-color:#d693a5}.tat.cool span{color:#b46279}
.modal-backdrop{position:fixed;inset:0;background:rgba(86,57,48,.28);display:none;align-items:center;justify-content:center;padding:14px;z-index:50}.modal-backdrop.open{display:flex}.save-modal{width:min(440px,94vw);max-height:88dvh;overflow:auto;background:#fffaf8;border:2px solid var(--brown);border-radius:16px;padding:10px;box-shadow:0 10px 30px rgba(90,64,56,.18)}.save-modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.save-modal-head h2{margin:0;font:700 16px/1 "Yomogi","Zen Maru Gothic",sans-serif}.close-btn{width:28px;height:28px;border:1px solid var(--brown);border-radius:8px;background:white}.save-note{font-size:8px;color:var(--brown2);margin:0 0 7px}.char-row,.slot{border:1px solid var(--line);border-radius:10px;padding:7px;margin-bottom:5px;background:white}.char-row-main{display:flex;justify-content:space-between;gap:8px;align-items:center}.char-name{font-size:11px;font-weight:700}.char-meta,.slot-meta{font-size:7px;color:var(--brown2)}.char-row button,.slot-actions button,.save-action{border:1px solid var(--brown2);border-radius:8px;background:#fff7fa;padding:6px 7px;font-size:8px}.char-row button{margin-top:5px;width:100%}.slot-top{display:flex;justify-content:space-between;gap:6px;align-items:center}.slot-title{font-size:9px;font-weight:700}.slot-actions{display:flex;gap:4px;margin-top:5px}.slot-actions button{flex:1}.save-action-row{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}.save-action.github{grid-column:1/-1;background:var(--pink2);border-color:var(--brown)}.save-status{font-size:7px;color:var(--brown2);min-height:12px;margin-top:5px}.hidden-file{display:none}
@media(max-height:720px){.app{gap:3px;padding-top:calc(3px + env(safe-area-inset-top));padding-bottom:calc(3px + env(safe-area-inset-bottom))}.game-header{min-height:31px;padding:2px 6px}.brand h1{font-size:19px}.stat{padding:1px 2px}.stat b{font-size:15px}.res,.mom{padding:2px 3px}.mc{height:12px}.vow{padding:3px 5px}.vcell{height:13px}.panel{padding:3px 4px}.asset{padding:2px 3px}}@media(max-width:390px){.brand span{display:none}.asset{grid-template-columns:62px 1fr}.ability{font-size:5.9px}.tat strong{font-size:7.5px}.top-btn{padding:3px 4px;font-size:7px}}
</style>
</head>
<body>
<section id="homeScreen" class="screen"><div class="home-card"><div class="home-mark">鉄</div><h1>Ironsworn<br>Solo RPG</h1><div class="en">SOLO ADVENTURE</div><div class="home-actions"><button id="homeLoad" class="home-btn primary">LOAD</button><button id="homeNew" class="home-btn">NEW</button></div><div class="home-foot">キャラクターごとに別セーブ</div></div></section>
<section id="newScreen" class="screen hidden"><div class="new-card"><h1>新しいキャラクター</h1><label class="new-label" for="newName">名前</label><input id="newName" class="new-input" maxlength="24" placeholder="キャラクター名"><label class="new-label">能力値</label><div class="new-stats"><div class="new-stat"><span>EDGE</span><select id="newEdge"><option>1</option><option>2</option><option selected>3</option></select></div><div class="new-stat"><span>HEART</span><select id="newHeart"><option selected>1</option><option>2</option><option>3</option></select></div><div class="new-stat"><span>IRON</span><select id="newIron"><option>1</option><option selected>2</option><option>3</option></select></div><div class="new-stat"><span>SHADOW</span><select id="newShadow"><option selected>1</option><option>2</option><option>3</option></select></div><div class="new-stat"><span>WITS</span><select id="newWits"><option>1</option><option selected>2</option><option>3</option></select></div></div><div class="new-help">Ironsworn標準：3 / 2 / 2 / 1 / 1 を5能力に割り振ります。</div><div id="newError" class="new-error"></div><div class="new-actions"><button id="cancelNew">戻る</button><button id="createNew" class="create">作成</button></div></div></section>
<section id="gameScreen" class="screen hidden"><div class="app"><header class="game-header box"><div class="brand"><h1 id="charName">白金</h1><span>IRONSWORN CHARACTER SHEET</span></div><div class="top-tools"><button id="goHome" class="top-btn">ホーム</button><button id="openSave" class="top-btn">セーブ</button><div class="xp"><span>XP</span><button class="sbtn" data-k="xp" data-d="-1">−</button><strong id="xp">1</strong><button class="sbtn" data-k="xp" data-d="1">＋</button></div></div></header><section class="stats"><div class="stat box"><span>EDGE</span><b id="statEdge">3</b></div><div class="stat box"><span>HEART</span><b id="statHeart">1</b></div><div class="stat box"><span>IRON</span><b id="statIron">2</b></div><div class="stat box"><span>SHADOW</span><b id="statShadow">1</b></div><div class="stat box"><span>WITS</span><b id="statWits">2</b></div></section><section class="resources"><div class="res box"><div class="rhead"><span class="label">体力</span><div class="ctrl"><button class="tinybtn" data-k="health" data-d="-1">−</button><strong id="health">5</strong><button class="tinybtn" data-k="health" data-d="1">＋</button></div></div></div><div class="res box"><div class="rhead"><span class="label">気力</span><div class="ctrl"><button class="tinybtn" data-k="spirit" data-d="-1">−</button><strong id="spirit">5</strong><button class="tinybtn" data-k="spirit" data-d="1">＋</button></div></div></div><div class="res box"><div class="rhead"><span class="label">補給</span><div class="ctrl"><button class="tinybtn" data-k="supply" data-d="-1">−</button><strong id="supply">5</strong><button class="tinybtn" data-k="supply" data-d="1">＋</button></div></div></div><div class="mom box"><div class="mhead"><span class="label">モメンタム</span><div class="ctrl"><button class="tinybtn" data-k="momentum" data-d="-1">−</button><strong id="momentum">2</strong><button class="tinybtn" data-k="momentum" data-d="1">＋</button></div></div><div id="mtrack" class="mtrack"></div></div></section><section class="vow box"><div class="vow-title"><small>現在の誓い</small><strong id="vowTitle">未設定</strong></div><div id="vtrack" class="vtrack"></div><div class="vow-num"><span id="vp">0</span>/10</div></section><section class="lower"><div class="panel box"><div class="ptitle"><h2>アセット</h2><span>取得済みをピンク表示</span></div><div id="assets" class="assets"></div></div><div class="panel box"><div class="ptitle"><h2>刺青</h2><span id="tattooHint">タップで状態切替</span></div><div id="tattoos" class="tattoos"></div></div></section></div></section>
<div id="managerModal" class="modal-backdrop"><div class="save-modal"><div class="save-modal-head"><h2 id="managerTitle">ロード</h2><button id="closeManager" class="close-btn">×</button></div><p id="managerNote" class="save-note"></p><div id="characterList"></div><div id="slotArea"></div><div class="save-action-row"><button id="loadGithub" class="save-action github">GitHubの白金・最新セーブを読み込む</button><button id="exportSave" class="save-action">JSONを書き出す</button><button id="importSave" class="save-action">JSONを読み込む</button><input id="importFile" class="hidden-file" type="file" accept="application/json,.json"></div><div id="saveStatus" class="save-status"></div></div></div>
<script>
const STORE_KEY="ironsworn-characters-v1",ACTIVE_KEY="ironsworn-active-character",WHITE_ID="shirogane";
const whiteTemplate={id:WHITE_ID,name:"白金",stats:{edge:3,heart:1,iron:2,shadow:1,wits:2},tracks:{health:5,spirit:5,supply:3,momentum:3,xp:1},vow:{title:"アデルを連絡拠点まで守る",progress:0},assets:[{name:"最後の民",type:"PATH",abilities:[["荒野の子",true],["獣を捌く者",false],["異邦の眼",false]]},{name:"薬草師",type:"PATH",abilities:[["薬草治療",true],["未取得",false],["未取得",false]]},{name:"肉",type:"COMPANION",abilities:[["Sly",false],["Knowing",false],["Diligent",true]]}],tattoos:{"道標":"ready","鷹目":"ready","守骨":"ready","影歩":"ready","狩牙":"ready","止血":"cool","熾火":"ready","息潜":"ready"},createdAt:"2026-08-19T00:00:00+09:00",updatedAt:new Date().toISOString()};
function clone(x){return JSON.parse(JSON.stringify(x))}function loadStore(){let st={};try{st=JSON.parse(localStorage.getItem(STORE_KEY)||"{}")||{}}catch(e){}if(!st[WHITE_ID]){const w=clone(whiteTemplate);try{const old=JSON.parse(localStorage.getItem("shirogane-v3")||"null");if(old){w.tracks.xp=old.xp??w.tracks.xp;w.tracks.health=old.health??w.tracks.health;w.tracks.spirit=old.spirit??w.tracks.spirit;w.tracks.supply=old.supply??w.tracks.supply;w.tracks.momentum=old.momentum??w.tracks.momentum;w.vow.progress=old.vow??w.vow.progress;w.tattoos={...w.tattoos,...(old.tattoos||{})}}}catch(e){}st[WHITE_ID]=w;localStorage.setItem(STORE_KEY,JSON.stringify(st))}return st}
let store=loadStore(),activeId=localStorage.getItem(ACTIVE_KEY)||WHITE_ID;if(!store[activeId])activeId=WHITE_ID;function saveStore(){if(store[activeId])store[activeId].updatedAt=new Date().toISOString();localStorage.setItem(STORE_KEY,JSON.stringify(store));localStorage.setItem(ACTIVE_KEY,activeId)}function active(){return store[activeId]}function show(x){["homeScreen","newScreen","gameScreen"].forEach(id=>document.getElementById(id).classList.add("hidden"));document.getElementById(x).classList.remove("hidden")}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function renderMomentum(){const c=active(),h=document.getElementById("mtrack");h.innerHTML="";for(let v=-6;v<=10;v++){const b=document.createElement("button");b.className="mc"+(v===c.tracks.momentum?" on":"");b.textContent=v;b.onclick=()=>{c.tracks.momentum=v;saveStore();renderGame()};h.appendChild(b)}}function renderVow(){const c=active(),h=document.getElementById("vtrack");h.innerHTML="";for(let i=1;i<=10;i++){const b=document.createElement("button");b.className="vcell"+(i<=c.vow.progress?" on":"");b.onclick=()=>{c.vow.progress=(c.vow.progress===i?i-1:i);saveStore();renderGame()};h.appendChild(b)}document.getElementById("vp").textContent=c.vow.progress;document.getElementById("vowTitle").textContent=c.vow.title||"未設定"}function renderAssets(){const h=document.getElementById("assets"),c=active();h.innerHTML="";if(!c.assets||!c.assets.length){h.innerHTML='<div class="empty-note">アセット未設定</div>';return}c.assets.slice(0,3).forEach(a=>{const d=document.createElement("div");d.className="asset";d.innerHTML='<div class="aname"><strong>'+a.name+'</strong><small>'+(a.type||"ASSET")+'</small></div><div class="abilities">'+(a.abilities||[]).map(x=>'<span class="ability '+(x[1]?"on":"")+'">'+x[0]+'</span>').join("")+'</div>';h.appendChild(d)})}function renderTattoos(){const h=document.getElementById("tattoos"),c=active();h.innerHTML="";const e=Object.entries(c.tattoos||{});document.getElementById("tattooHint").textContent=e.length?"タップで状態切替":"未設定";if(!e.length){h.innerHTML='<div class="empty-note">刺青なし</div>';return}e.slice(0,8).forEach(([n,st])=>{const b=document.createElement("button");b.className="tat"+(st==="cool"?" cool":"");b.innerHTML='<strong>'+n+'</strong><span>'+(st==="cool"?"回復中":"使用可")+'</span>';b.onclick=()=>{c.tattoos[n]=st==="cool"?"ready":"cool";saveStore();renderGame()};h.appendChild(b)})}
function renderGame(){const c=active();document.getElementById("charName").textContent=c.name;document.getElementById("xp").textContent=c.tracks.xp;document.getElementById("health").textContent=c.tracks.health;document.getElementById("spirit").textContent=c.tracks.spirit;document.getElementById("supply").textContent=c.tracks.supply;document.getElementById("momentum").textContent=c.tracks.momentum;document.getElementById("statEdge").textContent=c.stats.edge;document.getElementById("statHeart").textContent=c.stats.heart;document.getElementById("statIron").textContent=c.stats.iron;document.getElementById("statShadow").textContent=c.stats.shadow;document.getElementById("statWits").textContent=c.stats.wits;renderMomentum();renderVow();renderAssets();renderTattoos()}
document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const c=active(),k=b.dataset.k,d=Number(b.dataset.d);if(k==="xp")c.tracks.xp=clamp(c.tracks.xp+d,0,99);if(["health","spirit","supply"].includes(k))c.tracks[k]=clamp(c.tracks[k]+d,0,5);if(k==="momentum")c.tracks[k]=clamp(c.tracks[k]+d,-6,10);saveStore();renderGame()});
function openManager(mode){document.getElementById("managerModal").classList.add("open");document.getElementById("managerTitle").textContent=mode==="load"?"キャラクターをロード":"セーブ管理";document.getElementById("managerNote").textContent=mode==="load"?"作成済みキャラクターを選びます。":"現在のキャラクター："+active().name;document.getElementById("characterList").style.display=mode==="load"?"block":"none";document.getElementById("slotArea").style.display=mode==="save"?"block":"none";document.getElementById("loadGithub").style.display=mode==="load"?"block":"none";document.getElementById("saveStatus").textContent="";if(mode==="load")renderCharacterList();else renderSlots()}
function renderCharacterList(){const h=document.getElementById("characterList");h.innerHTML="";Object.values(store).sort((a,b)=>(b.updatedAt||"").localeCompare(a.updatedAt||"")).forEach(c=>{const r=document.createElement("div");r.className="char-row";const when=c.updatedAt?new Date(c.updatedAt).toLocaleString("ja-JP"):"";r.innerHTML='<div class="char-row-main"><div class="char-name">'+c.name+'</div><div class="char-meta">'+when+'</div></div><button>このキャラクターを開く</button>';r.querySelector("button").onclick=()=>{activeId=c.id;saveStore();renderGame();document.getElementById("managerModal").classList.remove("open");show("gameScreen")};h.appendChild(r)})}
function slotKey(n){return "ironsworn-slot-"+activeId+"-"+n}function renderSlots(){const h=document.getElementById("slotArea");h.innerHTML="";for(let n=1;n<=3;n++){let data=null;try{data=JSON.parse(localStorage.getItem(slotKey(n))||"null")}catch(e){}const d=document.createElement("div");d.className="slot";const when=data?.savedAt?new Date(data.savedAt).toLocaleString("ja-JP"):"未保存";d.innerHTML='<div class="slot-top"><div class="slot-title">スロット '+n+'</div><div class="slot-meta">'+when+'</div></div><div class="slot-actions"><button data-save>ここに保存</button><button data-load '+(data?"":"disabled")+'>読み込む</button></div>';d.querySelector("[data-save]").onclick=()=>{localStorage.setItem(slotKey(n),JSON.stringify({savedAt:new Date().toISOString(),character:clone(active())}));renderSlots();document.getElementById("saveStatus").textContent="スロット "+n+" に保存しました。"};d.querySelector("[data-load]").onclick=()=>{let x=null;try{x=JSON.parse(localStorage.getItem(slotKey(n))||"null")}catch(e){}if(!x)return;store[activeId]=x.character;saveStore();renderGame();document.getElementById("saveStatus").textContent="スロット "+n+" を読み込みました。"};h.appendChild(d)}}
async function loadGithubWhite(){const st=document.getElementById("saveStatus");st.textContent="GitHubの白金セーブを読み込み中…";try{const r=await fetch("saves/current.json?ts="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error();const g=await r.json(),t=g.character?.tracks||{},v=(g.vows||[]).find(x=>x.id==="V004"),w=store[WHITE_ID]||clone(whiteTemplate);w.name=g.character?.name||"白金";w.stats={...w.stats,...(g.character?.stats||{})};w.tracks={health:t.health??w.tracks.health,spirit:t.spirit??w.tracks.spirit,supply:t.supply??w.tracks.supply,momentum:t.momentum??w.tracks.momentum,xp:t.xp??w.tracks.xp};w.vow={title:v?.title||w.vow.title,progress:v?.progress??w.vow.progress};w.tattoos={...w.tattoos,...(g.character?.tattoos||{})};store[WHITE_ID]=w;activeId=WHITE_ID;saveStore();renderGame();document.getElementById("managerModal").classList.remove("open");show("gameScreen")}catch(e){st.textContent="GitHubセーブを読み込めませんでした。Web公開後に使えます。"}}
document.getElementById("homeLoad").onclick=()=>openManager("load");document.getElementById("homeNew").onclick=()=>{document.getElementById("newName").value="";document.getElementById("newError").textContent="";show("newScreen")};document.getElementById("cancelNew").onclick=()=>show("homeScreen");document.getElementById("createNew").onclick=()=>{const name=document.getElementById("newName").value.trim(),vals={edge:Number(document.getElementById("newEdge").value),heart:Number(document.getElementById("newHeart").value),iron:Number(document.getElementById("newIron").value),shadow:Number(document.getElementById("newShadow").value),wits:Number(document.getElementById("newWits").value)},arr=Object.values(vals).sort((a,b)=>b-a).join(",");if(!name){document.getElementById("newError").textContent="名前を入力してください。";return}if(arr!=="3,2,2,1,1"){document.getElementById("newError").textContent="能力値は 3 / 2 / 2 / 1 / 1 を1つずつ使います。";return}const id="char-"+Date.now();store[id]={id,name,stats:vals,tracks:{health:5,spirit:5,supply:5,momentum:2,xp:0},vow:{title:"未設定",progress:0},assets:[],tattoos:{},createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};activeId=id;saveStore();renderGame();show("gameScreen")};document.getElementById("goHome").onclick=()=>show("homeScreen");document.getElementById("openSave").onclick=()=>openManager("save");document.getElementById("closeManager").onclick=()=>document.getElementById("managerModal").classList.remove("open");document.getElementById("managerModal").onclick=e=>{if(e.target.id==="managerModal")e.currentTarget.classList.remove("open")};document.getElementById("loadGithub").onclick=loadGithubWhite;
document.getElementById("exportSave").onclick=()=>{const blob=new Blob([JSON.stringify({format:"ironsworn-character-save-v1",savedAt:new Date().toISOString(),character:active()?clone(active()):null},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=(active()?.name||"ironsworn")+"-save.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};document.getElementById("importSave").onclick=()=>document.getElementById("importFile").click();document.getElementById("importFile").onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const j=JSON.parse(await f.text()),c=j.character||j;if(!c.name||!c.stats||!c.tracks)throw new Error();const id=c.id&&c.id!==WHITE_ID?c.id:"char-"+Date.now();c.id=id;c.updatedAt=new Date().toISOString();store[id]=c;activeId=id;saveStore();renderGame();document.getElementById("managerModal").classList.remove("open");show("gameScreen")}catch(err){document.getElementById("saveStatus").textContent="このJSONは読み込めませんでした。"}e.target.value=""};saveStore();show("homeScreen");
</script>
