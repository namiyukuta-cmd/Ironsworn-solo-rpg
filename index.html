<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>白金キャラシ</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Yomogi&family=Zen+Maru+Gothic:wght@400;500;700&display=swap');
:root{--bg:#fffaf8;--paper:#fff;--pink:#f4c3cf;--pink2:#ffe7ed;--pink3:#eaa4b7;--brown:#7d574a;--brown2:#ad887c;--line:#d8bbb1;--text:#5a4038}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Zen Maru Gothic",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
button{font:inherit;color:inherit}
.app{height:100dvh;padding:calc(5px + env(safe-area-inset-top)) 6px calc(5px + env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto auto auto 1fr;gap:4px;max-width:760px;margin:0 auto}
.box{background:var(--paper);border:1.5px solid var(--brown);border-radius:10px}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 7px;min-height:36px}
.brand{display:flex;align-items:baseline;gap:7px}
.brand h1{margin:0;font:700 22px/1 "Yomogi","Zen Maru Gothic",sans-serif;color:var(--brown)}
.brand span{font-size:8px;color:var(--brown2);letter-spacing:.08em}
.xp{display:flex;align-items:center;gap:3px;font-size:9px}.xp strong{font-size:15px;min-width:18px;text-align:center}
.sbtn{width:21px;height:21px;padding:0;border:1px solid var(--brown);border-radius:7px;background:var(--pink2);line-height:1}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.stat{padding:2px 2px 3px;text-align:center;border:1px solid var(--line);border-radius:8px;background:#fffdfd}
.stat span{display:block;font:500 8px/1 "Yomogi","Zen Maru Gothic",sans-serif;color:var(--brown2)}
.stat b{display:block;font-size:17px;line-height:1.1}
.resources{display:grid;grid-template-columns:repeat(3,1fr) 2.15fr;gap:3px}
.res,.mom{border:1px solid var(--line);border-radius:8px;background:#fffdfd;padding:3px 4px}
.rhead,.mhead{display:flex;align-items:center;justify-content:space-between;gap:2px}
.label{font:500 8px/1 "Yomogi","Zen Maru Gothic",sans-serif;color:var(--brown2)}
.ctrl{display:flex;align-items:center;gap:2px}.ctrl strong{font-size:14px;min-width:15px;text-align:center}
.tinybtn{width:18px;height:18px;padding:0;border:1px solid var(--brown2);border-radius:6px;background:white;font-size:11px;line-height:1}
.mtrack{display:grid;grid-template-columns:repeat(17,1fr);gap:1px;margin-top:3px}
.mc{height:14px;border:1px solid var(--line);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:5.8px;background:#fff;color:var(--brown2);padding:0}
.mc.on{background:var(--pink);border-color:var(--brown);color:var(--brown);font-weight:700}
.vow{padding:4px 6px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:6px}
.vow-title small{display:block;font:500 7px/1 "Yomogi","Zen Maru Gothic",sans-serif;color:var(--brown2)}
.vow-title strong{display:block;font-size:9px;white-space:nowrap}
.vtrack{display:grid;grid-template-columns:repeat(10,1fr);gap:2px}
.vcell{height:16px;border:1px solid var(--brown2);border-radius:4px;background:white;padding:0}.vcell.on{background:var(--pink)}
.vow-num{font-size:8px;white-space:nowrap}
.lower{min-height:0;display:grid;grid-template-columns:1.15fr 1fr;gap:4px}
.panel{min-height:0;padding:4px 5px;display:grid;grid-template-rows:auto 1fr}
.ptitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.ptitle h2{margin:0;font:700 10px/1 "Yomogi","Zen Maru Gothic",sans-serif;color:var(--brown)}
.ptitle span{font-size:6.5px;color:var(--brown2)}
.assets{min-height:0;display:grid;grid-template-rows:repeat(3,1fr);gap:3px}
.asset{min-height:0;border:1px solid var(--line);border-radius:7px;background:#fffdfd;padding:3px 4px;display:grid;grid-template-columns:74px 1fr;align-items:start;gap:4px}
.aname strong{display:block;font-size:8.5px;line-height:1.05}.aname small{display:block;font-size:5.8px;color:var(--brown2)}
.abilities{display:flex;flex-wrap:wrap;align-content:start;gap:2px}
.ability{font-size:6.3px;line-height:1.1;padding:2px 3px;border:1px solid var(--line);border-radius:5px;color:var(--brown2);background:white}
.ability.on{background:var(--pink2);color:var(--brown);border-color:var(--pink3);font-weight:700}
.tattoos{min-height:0;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr);gap:3px}
.tat{min-height:0;border:1px solid var(--line);border-radius:7px;background:#fff;padding:2px 4px;text-align:left;display:flex;align-items:center;justify-content:space-between}
.tat strong{font-size:8px}.tat span{font-size:5.8px;color:var(--brown2)}
.tat.cool{background:#fff0f4;border-color:#d693a5}.tat.cool span{color:#b46279}
@media (max-height:720px){
  .app{gap:3px;padding-top:calc(3px + env(safe-area-inset-top));padding-bottom:calc(3px + env(safe-area-inset-bottom))}
  header{min-height:31px;padding:2px 6px}.brand h1{font-size:19px}.stat{padding:1px 2px}.stat b{font-size:15px}
  .res,.mom{padding:2px 3px}.mc{height:12px}.vow{padding:3px 5px}.vcell{height:13px}.panel{padding:3px 4px}.asset{padding:2px 3px}
}
@media (max-width:390px){.brand span{display:none}.asset{grid-template-columns:62px 1fr}.ability{font-size:5.9px}.tat strong{font-size:7.5px}}
</style>
</head>
<body>
<div class="app">
<header class="box">
  <div class="brand"><h1>白金</h1><span>IRONSWORN CHARACTER SHEET</span></div>
  <div class="xp"><span>XP</span><button class="sbtn" data-k="xp" data-d="-1">−</button><strong id="xp">1</strong><button class="sbtn" data-k="xp" data-d="1">＋</button></div>
</header>
<section class="stats">
  <div class="stat box"><span>EDGE</span><b>3</b></div><div class="stat box"><span>HEART</span><b>1</b></div><div class="stat box"><span>IRON</span><b>2</b></div><div class="stat box"><span>SHADOW</span><b>1</b></div><div class="stat box"><span>WITS</span><b>2</b></div>
</section>
<section class="resources">
  <div class="res box"><div class="rhead"><span class="label">体力</span><div class="ctrl"><button class="tinybtn" data-k="health" data-d="-1">−</button><strong id="health">5</strong><button class="tinybtn" data-k="health" data-d="1">＋</button></div></div></div>
  <div class="res box"><div class="rhead"><span class="label">気力</span><div class="ctrl"><button class="tinybtn" data-k="spirit" data-d="-1">−</button><strong id="spirit">5</strong><button class="tinybtn" data-k="spirit" data-d="1">＋</button></div></div></div>
  <div class="res box"><div class="rhead"><span class="label">補給</span><div class="ctrl"><button class="tinybtn" data-k="supply" data-d="-1">−</button><strong id="supply">3</strong><button class="tinybtn" data-k="supply" data-d="1">＋</button></div></div></div>
  <div class="mom box"><div class="mhead"><span class="label">モメンタム</span><div class="ctrl"><button class="tinybtn" data-k="momentum" data-d="-1">−</button><strong id="momentum">3</strong><button class="tinybtn" data-k="momentum" data-d="1">＋</button></div></div><div id="mtrack" class="mtrack"></div></div>
</section>
<section class="vow box">
  <div class="vow-title"><small>現在の誓い</small><strong>アデルを連絡拠点まで守る</strong></div>
  <div id="vtrack" class="vtrack"></div><div class="vow-num"><span id="vp">0</span>/10</div>
</section>
<section class="lower">
  <div class="panel box">
    <div class="ptitle"><h2>アセット</h2><span>取得済みをピンク表示</span></div>
    <div class="assets">
      <div class="asset"><div class="aname"><strong>最後の民</strong><small>PATH</small></div><div class="abilities"><span class="ability on">荒野の子</span><span class="ability">獣を捌く者</span><span class="ability">異邦の眼</span></div></div>
      <div class="asset"><div class="aname"><strong>薬草師</strong><small>PATH</small></div><div class="abilities"><span class="ability on">薬草治療</span><span class="ability">未取得</span><span class="ability">未取得</span></div></div>
      <div class="asset"><div class="aname"><strong>肉</strong><small>COMPANION</small></div><div class="abilities"><span class="ability">Sly</span><span class="ability">Knowing</span><span class="ability on">Diligent</span></div></div>
    </div>
  </div>
  <div class="panel box">
    <div class="ptitle"><h2>刺青</h2><span>タップで状態切替</span></div>
    <div id="tattoos" class="tattoos"></div>
  </div>
</section>
</div>
<script>
const def={xp:1,health:5,spirit:5,supply:3,momentum:3,vow:0,tattoos:{"道標":"ready","鷹目":"ready","守骨":"ready","影歩":"ready","狩牙":"ready","止血":"cool","熾火":"ready","息潜":"ready"}};
let s;try{const saved=JSON.parse(localStorage.getItem("shirogane-v3")||"null");s={...def,...(saved||{}),tattoos:{...def.tattoos,...((saved||{}).tattoos||{})}}}catch(e){s=JSON.parse(JSON.stringify(def))}
const save=()=>localStorage.setItem("shirogane-v3",JSON.stringify(s));const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function renderMomentum(){const h=document.getElementById("mtrack");h.innerHTML="";for(let v=-6;v<=10;v++){const b=document.createElement("button");b.className="mc"+(v===s.momentum?" on":"");b.textContent=v;b.onclick=()=>{s.momentum=v;save();render()};h.appendChild(b)}}
function renderVow(){const h=document.getElementById("vtrack");h.innerHTML="";for(let i=1;i<=10;i++){const b=document.createElement("button");b.className="vcell"+(i<=s.vow?" on":"");b.onclick=()=>{s.vow=(s.vow===i?i-1:i);save();render()};h.appendChild(b)}document.getElementById("vp").textContent=s.vow}
function renderTattoos(){const h=document.getElementById("tattoos");h.innerHTML="";Object.entries(s.tattoos).forEach(([name,status])=>{const b=document.createElement("button");b.className="tat"+(status==="cool"?" cool":"");b.innerHTML="<strong>"+name+"</strong><span>"+(status==="cool"?"回復中":"使用可")+"</span>";b.onclick=()=>{s.tattoos[name]=status==="cool"?"ready":"cool";save();render()};h.appendChild(b)})}
function render(){["xp","health","spirit","supply","momentum"].forEach(k=>document.getElementById(k).textContent=s[k]);renderMomentum();renderVow();renderTattoos()}
document.querySelectorAll("[data-k]").forEach(b=>{b.onclick=()=>{const k=b.dataset.k,d=Number(b.dataset.d);if(k==="xp")s[k]=clamp(s[k]+d,0,99);if(["health","spirit","supply"].includes(k))s[k]=clamp(s[k]+d,0,5);if(k==="momentum")s[k]=clamp(s[k]+d,-6,10);save();render()}});
render();
</script>
</body>
</html>
